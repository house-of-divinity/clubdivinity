name: Cron — sync-tickets

# Hourly. Pulls new ticket purchases from TicketSpice and syncs
# them into our event_tickets table. Matches buyer_email to
# existing members where possible.
#
# Trigger manually from the Actions tab → "Run workflow".

on:
  schedule:
    - cron: '15 * * * *'   # :15 past each hour so it doesn't pile on with the other crons at :00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/sync-tickets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}\n" \
            "https://clubdivinity.com/api/cron/sync-tickets"
